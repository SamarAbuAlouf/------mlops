# GitHub Actions CI/CD Pipeline
# Runs on every push and pull request to ensure code quality and reproducibility
name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Quality checks and automated test execution
  test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint and format checks
        run: |
          python -m ruff check .
          python -m black --check src app tests

      - name: Run pytest test suite (A failing test stops the pipeline!)
        run: |
          python -m pytest -v --cov=src --cov=app --cov-report=term-missing tests/


  # 2. Container image build
  build-container:
    name: Build Docker Container
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: olist-delay-prediction:latest
