# =============================================================================
# DVC Pipeline Specification
# Reproducible data and model pipeline stages
# =============================================================================
stages:
  inference_verify:
    cmd: python -c "from src.features import transform; from src.predict import predict; import pandas as pd; df=pd.read_parquet('artifacts/data/03_test.parquet').head(5); print(predict(transform(df)[:1]))"
    deps:
      - artifacts/data/03_test.parquet
      - artifacts/models/preprocessor.joblib
      - artifacts/models/final_model.joblib
      - src/features.py
      - src/predict.py
